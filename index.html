<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p4_architecture_school</title>
    <style>
      :root{
        --verd-color: #D9E8D0;
        --terracota-color: #E9B8A9;
        --groc-color: #F3D88A;
        --blau-color: #B9D9E8; 
        }
        * {
          box-sizing: border-box;
        }
      header {
        width: 700px;
        margin: 20px auto;
        background-color:antiquewhite;
      }
      .piso-1,
      .piso-2 {
        width: 250px;
        height: 50px;
        border: 2px solid black;
        padding: 10px;
        font-size: 20px;
      }
      .piso-1{
        background-color: var(--verd-color);
        text-align: left;
      }
      .piso-2 {
        background-color: var(--terracota-color);
        text-align: center;
      }
      h3 {
        width: 100px;
        height: 30px;
        border: 2px solid black;
        padding: 10px;
        font-size: 10px;
        background-color: var(--groc-color);
      }
      h2 {
        width: 200px;
        height: 45px;
        border: 2px solid black;
        padding: 10px;
        font-size: 15px;
        text-align: right;
        background-color: var(--blau-color);
        margin-left: 500px;
      }
      .escaló-1 {
        margin-left: 180px;
        text-align: left;
      }
      .escaló-2 {
        margin-left: 260px;
        text-align: center;
      }
       .escaló-3 {
        margin-left: 340px;
        text-align: right;
      }
       .escaló-4 {
        margin-left: 420px;
        text-align: center;
      }
      .escaló-5 {
        margin-left: 420px;
        text-align: right;
      }
      .escaló-6 {
        margin-left: 340px;
        text-align: center;
      }
      .escaló-7 {
        margin-left: 260px;
        text-align: left;
      }
      .escaló-8 {
        margin-left: 180px;
        text-align: center;
      }

    </style>
</head>
<body>
    <header>
  <h1 class="piso-1">Piso -1</h1> 
  <h3 class="escaló-1">Escaló 1</h3> 
  <h3 class="escaló-2">Escaló 2</h3>
  <h3 class="escaló-3">Escaló 3</h3>
  <h3 class="escaló-4">Escaló 4</h3>

  <h2 class="Replanell">Replanell</h2>

  <h3 class="escaló-5">Escaló 5</h3>
  <h3 class="escaló-6">Escaló 6</h3>
  <h3 class="escaló-7">Escaló 7</h3>
  <h3 class="escaló-8">Escaló 8</h3>

  <h1 class="piso-2">Piso -2</h1>
  
  </header>
</body>
</html>
